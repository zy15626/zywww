<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迷你贪吃蛇 · 经典版</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a2a32;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 12px;
        }
        .game-container {
            background: #1f3a3f;
            padding: 24px 24px 20px;
            border-radius: 36px;
            box-shadow: 0 12px 0 #0e1a1e, 0 8px 20px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            display: block;
            border-radius: 20px;
            background-color: #0b1a1f;
            box-shadow: inset 0 0 0 2px #2f5e66, 0 0 0 3px #0f1f23;
            width: 400px;
            height: 400px;
            image-rendering: crisp-edges; 
        }
        .info-panel {
            width: 100%;
            margin-top: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #d1e7e9;
            text-shadow: 0 2px 0 #0b1a1f;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .score-box {
            background: #0f262c;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 1.5rem;
            box-shadow: inset 0 2px 5px #0b1a1f, 0 4px 0 #081317;
            color: #b7e4e8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .score-box span {
            font-size: 1.8rem;
            color: #f0ffb0;
            min-width: 3rem;
            text-align: center;
        }
        button {
            background: #2e5e66;
            border: none;
            color: #e2f2f5;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 10px 30px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 5px 0 #123036, 0 3px 8px black;
            transition: 0.06s linear;
            letter-spacing: 1px;
            font-family: inherit;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        button:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #123036, 0 4px 10px black;
        }
        button:disabled {
            opacity: 0.6;
            transform: translateY(3px);
            box-shadow: 0 2px 0 #123036;
            cursor: not-allowed;
            pointer-events: none;
        }
        .hint {
            margin-top: 12px;
            color: #7dafb8;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
            letter-spacing: 0.3px;
        }
        .hint kbd {
            background: #0f262c;
            padding: 3px 8px;
            border-radius: 30px;
            font-weight: 700;
            color: #b7e4e8;
            border: 1px solid #2e5e66;
            margin: 0 2px;
        }
    </style>
</head>
<body>
<div class="game-container">
    <canvas id="snakeCanvas" width="400" height="400"></canvas>
    <div class="info-panel">
        <div class="score-box">🍎 <span id="scoreDisplay">0</span></div>
        <button id="restartBtn">↻ 新游戏</button>
    </div>
    <div class="hint">
        <kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动
    </div>
</div>
<script>
    (function(){
        // ---------- 配置 ----------
        const COLS = 20;              // 20x20 网格
        const ROWS = 20;
        const CELL_SIZE = 20;        // 像素 (400/20)
        const TICK_INTERVAL = 150;   // 毫秒 (适中速度)

        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const restartBtn = document.getElementById('restartBtn');

        // ---------- 游戏状态 ----------
        let snake = [];              // 坐标数组 [x,y]
        let food = { x: 6, y: 10 };
        let direction = 'RIGHT';     // 当前移动方向
        let nextDirection = 'RIGHT'; // 缓冲方向
        let score = 0;
        let gameOver = false;
        let gameLoopInterval = null;

        // 防止同一帧/同一 tick 内多次改变方向
        let directionChangedThisTick = false;

        // ---------- 初始化 / 重置 ----------
        function initGame() {
            // 停止旧循环
            if (gameLoopInterval) {
                clearInterval(gameLoopInterval);
                gameLoopInterval = null;
            }

            // 蛇: 长度为3, 水平放置
            snake = [
                { x: 9, y: 10 },  // 头
                { x: 8, y: 10 },
                { x: 7, y: 10 }
            ];
            direction = 'RIGHT';
            nextDirection = 'RIGHT';
            score = 0;
            gameOver = false;
            directionChangedThisTick = false;

            // 生成第一个食物 (避开蛇身)
            generateFood();

            updateScore();
            draw();

            // 启动游戏循环
            gameLoopInterval = setInterval(gameTick, TICK_INTERVAL);
        }

        // ---------- 生成食物 (保证不在蛇身上) ----------
        function generateFood() {
            const maxAttempts = 2000;
            let attempts = 0;
            let newFood = null;

            // 先收集所有蛇占用的格子 (用 Set 提高查找效率)
            const snakeSet = new Set(snake.map(seg => `${seg.x},${seg.y}`));

            // 如果蛇已经占满整个棋盘 → 胜利 (但贪吃蛇一般视为胜利，这里做处理：返回 false 表示无法生成)
            if (snakeSet.size >= COLS * ROWS) {
                // 棋盘满了，游戏胜利 (但我们把食物设为 null 并在 tick 中处理胜利)
                food = null;
                return false;
            }

            while (attempts < maxAttempts) {
                const randX = Math.floor(Math.random() * COLS);
                const randY = Math.floor(Math.random() * ROWS);
                if (!snakeSet.has(`${randX},${randY}`)) {
                    newFood = { x: randX, y: randY };
                    break;
                }
                attempts++;
            }

            // 极端情况：如果随机不到, 遍历所有格子 (基本不会发生)
            if (!newFood) {
                for (let y = 0; y < ROWS; y++) {
                    for (let x = 0; x < COLS; x++) {
                        if (!snakeSet.has(`${x},${y}`)) {
                            newFood = { x, y };
                            break;
                        }
                    }
                    if (newFood) break;
                }
            }

            food = newFood;  // 可能为 null (棋盘满)
            return food !== null;
        }

        // ---------- 更新分数显示 ----------
        function updateScore() {
            scoreSpan.textContent = score;
        }

        // ---------- 蛇移动一步 (tick) ----------
        function gameTick() {
            if (gameOver) return;

            // 如果食物不存在 (棋盘满了导致胜利), 但贪吃蛇经典中占满棋盘很难, 我们处理为胜利
            if (!food) {
                // 如果蛇的长度占满棋盘, 则胜利
                if (snake.length >= COLS * ROWS) {
                    gameOver = true;
                    clearInterval(gameLoopInterval);
                    gameLoopInterval = null;
                    draw(); // 重绘显示胜利信息
                } else {
                    // 意外情况: 重新生成食物 (极少数)
                    generateFood();
                }
                return;
            }

            // 1. 采纳缓冲方向 (但不能反向)
            const opposite = {
                'UP': 'DOWN',
                'DOWN': 'UP',
                'LEFT': 'RIGHT',
                'RIGHT': 'LEFT'
            };
            // 如果 nextDirection 不是当前方向的相反方向，则更新 direction
            if (nextDirection && opposite[nextDirection] !== direction) {
                direction = nextDirection;
            }

            // 2. 计算新头部坐标
            const head = snake[0];
            let newHead = { ...head };

            switch (direction) {
                case 'RIGHT': newHead.x += 1; break;
                case 'LEFT':  newHead.x -= 1; break;
                case 'UP':    newHead.y -= 1; break;
                case 'DOWN':  newHead.y += 1; break;
                default: break;
            }

            // 3. 检查是否吃到食物
            const isEating = food && newHead.x === food.x && newHead.y === food.y;

            // 4. 处理蛇的移动 (先构造新蛇)
            let newSnake = [newHead, ...snake];

            if (!isEating) {
                // 没吃到食物: 移除尾部
                newSnake.pop();
            }

            // 5. 碰撞检测 (边界 & 自身)
            const headCollision =
                newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS ||
                newSnake.slice(1).some(segment => segment.x === newHead.x && segment.y === newHead.y);

            if (headCollision) {
                gameOver = true;
                clearInterval(gameLoopInterval);
                gameLoopInterval = null;
                draw();   // 绘制结束画面
                return;
            }

            // 6. 更新蛇
            snake = newSnake;

            // 7. 如果吃到食物, 分数+1, 生成新食物, 且不弹出尾部(已处理)
            if (isEating) {
                score++;
                updateScore();
                const success = generateFood();
                if (!success) {
                    // 如果棋盘满了 (理论上几乎不可能) 但视为胜利
                    if (snake.length >= COLS * ROWS) {
                        gameOver = true;
                        clearInterval(gameLoopInterval);
                        gameLoopInterval = null;
                        draw();
                        return;
                    }
                }
            }

            // 重置方向改变标记 (为下一次输入做准备)
            directionChangedThisTick = false;

            // 8. 重绘
            draw();
        }

        // ---------- 绘制一切 ----------
        function draw() {
            ctx.clearRect(0, 0, 400, 400);

            // 绘制网格 (浅暗线)
            ctx.strokeStyle = '#1c3a40';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.strokeStyle = '#1c3a40';
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }

            // 绘制食物 (红苹果样式)
            if (food) {
                const fx = food.x * CELL_SIZE;
                const fy = food.y * CELL_SIZE;

                // 外发光
                ctx.shadowColor = '#f55';
                ctx.shadowBlur = 10;
                // 圆形食物
                ctx.beginPath();
                ctx.arc(fx + CELL_SIZE/2, fy + CELL_SIZE/2, CELL_SIZE/2 - 2, 0, 2 * Math.PI);
                ctx.fillStyle = '#e63946';
                ctx.fill();
                // 高光
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(fx + CELL_SIZE/2 - 3, fy + CELL_SIZE/2 - 3, 3, 0, 2 * Math.PI);
                ctx.fillStyle = '#ff8a8a';
                ctx.fill();
                // 叶子
                ctx.fillStyle = '#6abf4b';
                ctx.beginPath();
                ctx.ellipse(fx + CELL_SIZE/2 + 2, fy + 5, 4, 2.5, 0.3, 0, 2 * Math.PI);
                ctx.fill();
            } else {
                // 食物为 null (棋盘满) 不绘制, 但胜利信息会显示
            }

            // 绘制蛇
            for (let i = 0; i < snake.length; i++) {
                const seg = snake[i];
                const sx = seg.x * CELL_SIZE;
                const sy = seg.y * CELL_SIZE;
                const padding = i === 0 ? 2 : 3; // 头部稍大, 身体稍微圆润

                // 头部用亮绿色, 身体用渐变绿
                if (i === 0) {
                    ctx.shadowColor = '#9bff9b';
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = '#7ed957';
                } else {
                    ctx.shadowColor = '#5fa84b';
                    ctx.shadowBlur = 5;
                    // 身体颜色随位置渐变
                    const intensity = 0.7 + (i / snake.length) * 0.3;
                    ctx.fillStyle = `rgb(70, 140, 70)`;
                }

                // 圆角方形 (更活泼)
                const radius = 6;
                ctx.beginPath();
                ctx.roundRect(sx + 1, sy + 1, CELL_SIZE - 2, CELL_SIZE - 2, radius);
                ctx.fill();

                // 眼睛 (仅头部)
                if (i === 0) {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#f0f0f0';
                    ctx.beginPath();
                    ctx.arc(sx + 6, sy + 6, 2.5, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(sx + 14, sy + 6, 2.5, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillStyle = '#0a1a1f';
                    ctx.beginPath();
                    ctx.arc(sx + 6, sy + 6, 1.5, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(sx + 14, sy + 6, 1.5, 0, 2 * Math.PI);
                    ctx.fill();
                }
            }
            // 重置阴影
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';

            // 如果游戏结束, 绘制半透明遮罩和文字
            if (gameOver) {
                ctx.fillStyle = 'rgba(10, 20, 20, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.font = 'bold 32px "Segoe UI", Roboto, sans-serif';
                ctx.fillStyle = '#f0ffe0';
                ctx.shadowColor = '#1e4a4f';
                ctx.shadowBlur = 12;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                let message = '游戏结束';
                if (snake.length >= COLS * ROWS) {
                    message = '🏆 你赢了!';
                }
                ctx.fillText(message, canvas.width/2, canvas.height/2);
                ctx.shadowBlur = 0;
            }
        }

        // 添加 canvas 的 roundRect 方法 (兼容)
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            return this;
        };

        // ---------- 方向键处理 ----------
        function handleKeyDown(e) {
            const key = e.key;
            // 阻止箭头键滚动、WASD可能引发的输入
            const preventKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'W', 'a', 'A', 's', 'S', 'd', 'D'];
            if (preventKeys.includes(key)) {
                e.preventDefault();
            }

            if (gameOver) return;

            // 方向映射
            let newDir = null;
            if (key === 'ArrowUp' || key === 'w' || key === 'W') newDir = 'UP';
            else if (key === 'ArrowDown' || key === 's' || key === 'S') newDir = 'DOWN';
            else if (key === 'ArrowLeft' || key === 'a' || key === 'A') newDir = 'LEFT';
            else if (key === 'ArrowRight' || key === 'd' || key === 'D') newDir = 'RIGHT';
            else return;

            // 禁止反向 (不能立刻掉头)
            const opposite = {
                'UP': 'DOWN',
                'DOWN': 'UP',
                'LEFT': 'RIGHT',
                'RIGHT': 'LEFT'
            };

            // 如果当前方向与 newDir 相反，忽略 (但注意: 方向可能尚未更新, 以 direction 为准)
            if (opposite[newDir] === direction) {
                return;
            }

            // 更新缓冲方向
            nextDirection = newDir;
        }

        // ---------- 重启 ----------
        function restartGame() {
            initGame();
        }

        // ---------- 事件绑定 ----------
        window.addEventListener('keydown', handleKeyDown);

        // 页面失去焦点时不清除，但保留游戏状态 (不做特殊处理)
        // 移动端也支持按钮

        restartBtn.addEventListener('click', restartGame);

        // 防止页面通过方向键滚动 (再次确保)
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'w', 'W', 'a', 'A', 's', 'S', 'd', 'D'].includes(e.key)) {
                e.preventDefault();
            }
        }, { passive: false });

        // ---------- 启动游戏 ----------
        initGame();

        // 可选：触摸屏或点击canvas重新开始 (如果游戏结束)
        canvas.addEventListener('click', () => {
            if (gameOver) {
                restartGame();
            }
        });
    })();
</script>
</body>
</html>
